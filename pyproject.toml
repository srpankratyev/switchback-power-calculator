[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "switchback-power-calculator"
version = "1.0.0"
description = "Power and sample-size calculator for switchback experiments (cluster × time randomization). Implements Pankratev (2026); parameters or pre-period data."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sergei Pankratev" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
keywords = ["switchback", "experiment", "power", "sample-size", "causal-inference"]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["jupyter>=1.0", "ipykernel>=6.0", "pytest>=7.0"]

[project.urls]
Repository = "https://github.com/srpankratyev/switchback-power-calculator"
Paper = "https://arxiv.org/abs/2606.03012"

[tool.setuptools.packages.find]
where = ["."]
include = ["switchback_power_calculator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
